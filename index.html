
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>そとつぶ | 海外交流SNS</title>
  <style>
    body {
      margin: 0;
      background: #f5f7fa;
      color: #222;
      font-family: sans-serif;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0; }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .post {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }
    .name { font-weight: bold; }
    .country {
      color: #666;
      font-size: 14px;
    }
    .actions {
      color: #777;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>そとつぶ</h1>
    <p>海外に興味がある日本人の交流広場</p>
  </header>

  <main>
    <div class="post">
      <h3>つぶやいてみよう</h3>
      <textarea rows="3"
        placeholder="今、何を考えていますか？"></textarea>
      <button type="button">投稿する</button>
    </div>

    <div class="post">
      <div class="name">旅する猫</div>
      <div class="country">🇬🇧 イギリス・在住</div>
      <p>ロンドンに来て半年。皆さん休日は何をしていますか？</p>
      <div class="actions">♡ 12　💬 5</div>
    </div>

    <div class="post">
      <div class="name">青い空</div>
      <div class="country">🇦🇺 オーストラリア・渡航希望</div>
      <p>来年ワーホリに行きたいです。仕事探しは大変ですか？</p>
      <div class="actions">♡ 8　💬 3</div>
    </div>
  </main>
</body>
</html>
