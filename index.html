
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>そとつぶ | 海外交流SNS</title>
  <style>
    body {
      margin: 0;
      background: #f5f7fa;
      color: #222;
      font-family: sans-serif;
    }
    header {
      background: #2563eb;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header h1 { margin: 0; }
    main {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }
    .post {
      background: white;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 12px;
      border: 1px solid #ddd;
    }
    .name { font-weight: bold; }
    .country {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }
    .actions {
      color: #777;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font: inherit;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }
    .delete {
      background: #eee;
      color: #555;
      font-size: 13px;
      padding: 7px 12px;
    }
    .notice {
      color: #666;
      font-size: 13px;
    }
    .message {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <header>
    <h1>そとつぶ</h1>
    <p>海外に興味がある日本人の交流広場</p>
  </header>

  <main>
    <div class="post">
      <h3>つぶやいてみよう</h3>

      <textarea id="message" rows="3"
        maxlength="280"
        placeholder="今、何を考えていますか？"></textarea>

      <button id="submit" type="button">
        投稿する
      </button>

      <p class="notice">
        ※お試し機能です。投稿はこのブラウザにのみ保存されます。
      </p>
    </div>

    <div id="posts"></div>

    <div class="post">
      <div class="name">旅する猫</div>
      <div class="country">🇬🇧 イギリス・在住</div>
      <p>ロンドンに来て半年。皆さん休日は何をしていますか？</p>
      <div class="actions">♡ 12　💬 5</div>
    </div>

    <div class="post">
      <div class="name">青い空</div>
      <div class="country">🇦🇺 オーストラリア・渡航希望</div>
      <p>来年ワーホリに行きたいです。仕事探しは大変ですか？</p>
      <div class="actions">♡ 8　💬 3</div>
    </div>
  </main>

  <script>
    const messageInput = document.getElementById("message");
    const postsArea = document.getElementById("posts");
    const submitButton = document.getElementById("submit");
    const storageKey = "sototubu-demo-posts";

    let posts = [];

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (Array.isArray(saved)) {
        posts = saved.filter(item => typeof item === "string");
      }
    } catch (error) {
      posts = [];
    }

    function savePosts() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(posts));
        return true;
      } catch (error) {
        alert("保存できませんでした。ブラウザの設定をご確認ください。");
        return false;
      }
    }

    function showPosts() {
      postsArea.replaceChildren();

      posts.forEach((message, index) => {
        const card = document.createElement("div");
        card.className = "post";

        const name = document.createElement("div");
        name.className = "name";
        name.textContent = "あなた";

        const country = document.createElement("div");
        country.className = "country";
        country.textContent = "🌏 お試し投稿";

        const body = document.createElement("p");
        body.className = "message";
        body.textContent = message;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete";
        deleteButton.type = "button";
        deleteButton.textContent = "削除する";

        deleteButton.addEventListener("click", () => {
          if (!confirm("この投稿を削除しますか？")) return;
          const oldPosts = [...posts];
          posts.splice(index, 1);
          if (!savePosts()) posts = oldPosts;
          showPosts();
        });

        card.append(name, country, body, deleteButton);
        postsArea.appendChild(card);
      });
    }

    submitButton.addEventListener("click", () => {
      const message = messageInput.value.trim();

      if (!message) {
        alert("文章を入力してください。");
        return;
      }

      const oldPosts = [...posts];
      posts.unshift(message);

      if (!savePosts()) {
        posts = oldPosts;
        return;
      }

      messageInput.value = "";
      showPosts();
    });

    showPosts();
  </script>
</body>
</html>
