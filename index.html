
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>そとつぶ | 海外交流SNS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>そとつぶ</h1>
  <p>海外に興味がある日本人の交流広場</p>
</header>

<main>

<section class="post" id="authSection">
  <h2>会員登録・ログイン</h2>
  <div id="loginFields">
  <label for="authEmail">メールアドレス</label>
  <input id="authEmail" type="email"
         autocomplete="email"
         placeholder="メールアドレス">
  
  <label for="authPassword">パスワード</label>
  <input id="authPassword" type="password"
         autocomplete="current-password"
         placeholder="パスワード">
  </div>
  <button id="signUpButton" type="button">
    新規会員登録
  </button>

  <button id="loginButton" type="button">
    ログイン
  </button>

  <button id="logoutButton" type="button">
    ログアウト
  </button>
  <p id="welcomeMessage" hidden></p>
  <p id="authMessage"></p>
</section>

  <section class="post" id="profileSection">
  <h2>マイプロフィール</h2>

<div id="profileDisplay" hidden>
  <p>ニックネーム：<span id="displayName"></span></p>
  <p>国名：<span id="displayCountry"></span></p>
  <p>現在の状況：<span id="displayStatus"></span></p>
</div>
    <div id="profileFields">
    <label for="nickname">ニックネーム</label>
    <input id="nickname" maxlength="30"
      placeholder="例：旅する猫">

    <label for="country">国名</label>
    <select id="country">
      <option value="">選択してください</option>
      <option value="🇯🇵 日本">🇯🇵 日本</option>
      <option value="🇬🇧 イギリス">🇬🇧 イギリス</option>
      <option value="🇦🇺 オーストラリア">🇦🇺 オーストラリア</option>
      <option value="🇨🇦 カナダ">🇨🇦 カナダ</option>
      <option value="🇳🇿 ニュージーランド">🇳🇿 ニュージーランド</option>
      <option value="🇺🇸 アメリカ">🇺🇸 アメリカ</option>
      <option value="🇫🇷 フランス">🇫🇷 フランス</option>
      <option value="🇩🇪 ドイツ">🇩🇪 ドイツ</option>
      <option value="🌏 その他・非公開">🌏 その他・非公開</option>
    </select>

    <label for="status">現在の状況</label>
    <select id="status">
      <option value="在住">在住</option>
      <option value="渡航希望">渡航希望</option>
      <option value="興味あり">興味あり</option>
    </select>

    <button id="saveProfile" type="button">
      プロフィールを保存
    </button>

    <p class="notice" id="profileNotice">
      プロフィールはこのブラウザにのみ保存されます。
    </p>
    </div>
  <button id="editProfileButton" type="button" hidden>
  プロフィールを編集
  </button>
  </section>

  <section class="post">
    <h2>つぶやいてみよう</h2>

    <textarea id="message" rows="3" maxlength="280"
      placeholder="今、何を考えていますか？"></textarea>

    <button id="submit" type="button">投稿する</button>

    <p class="notice">
      
    </p>
  </section>

  <div id="posts"></div>

  <section class="post">
    <div class="name">旅する猫</div>
    <div class="country">🇬🇧 イギリス・在住</div>
    <p>ロンドンに来て半年。皆さん休日は何をしていますか？</p>
    <div class="actions">♡ 12　💬 5</div>
  </section>

  <section class="post">
    <div class="name">青い空</div>
    <div class="country">🇦🇺 オーストラリア・渡航希望</div>
    <p>来年ワーホリに行きたいです。仕事探しは大変ですか？</p>
    <div class="actions">♡ 8　💬 3</div>
  </section>

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
